version: "1"

services:
  # -----------------------------------------------------------
  # WEB API SERVICE
  # -----------------------------------------------------------
  - type: web
    name: eopyy-backend
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: API_HEADER
        value: X-API-Key

  # -----------------------------------------------------------
  # REALTIME WORKER (corrected)
  # -----------------------------------------------------------
  - type: worker
    name: eopyy-worker-realtime
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker_realtime
    envVars:
      - key: DATABASE_URL
        sync: false

  # -----------------------------------------------------------
  # BATCH WORKER (already correct)
  # -----------------------------------------------------------
  - type: worker
    name: eopyy-worker-batch
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker_batch
    envVars:
      - key: DATABASE_URL
        sync: false

databases:
  - name: neondb
